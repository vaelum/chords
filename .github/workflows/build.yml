name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-appimage
            os: ubuntu-22.04
            kind: appimage
          - name: windows-exe
            os: windows-latest
            kind: windows
          - name: android-apk
            os: ubuntu-22.04
            kind: android

    steps:
      - uses: actions/checkout@v4

      # Node is needed by Tauri's beforeBuildCommand, which precompiles the
      # frontend JSX (server/scripts/build-frontend.js) before bundling.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        if: matrix.kind == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # ---- Linux (AppImage) system deps ----
      - name: Install Linux build deps
        if: matrix.kind == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # ---- Android toolchain ----
      - name: Set up JDK 17
        if: matrix.kind == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: matrix.kind == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK + platform
        if: matrix.kind == 'android'
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      # ---- Tauri CLI (prebuilt binary, no compile) ----
      - name: Install Tauri CLI
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2.0.0

      # ---- Builds ----
      - name: Build Linux AppImage
        if: matrix.kind == 'appimage'
        working-directory: app
        env:
          # linuxdeploy needs FUSE, which CI runners lack; extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        run: cargo tauri build --bundles appimage

      - name: Build Windows exe
        if: matrix.kind == 'windows'
        working-directory: app
        run: cargo tauri build --bundles nsis

      - name: Build Android APK
        if: matrix.kind == 'android'
        working-directory: app
        run: |
          cargo tauri android init
          # `android init` regenerates gen/android (git-ignored) from a template
          # that carries Tauri's placeholder launcher icon. Copy the real chords
          # icons in before building — same step as butler.py's sync_android_icons.
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          cargo tauri android build --apk

      # Tauri's release APK is unsigned, and Android won't install an unsigned
      # APK. Sign it here (zipalign + apksigner) so the artifact is sideloadable —
      # same flow as `butler.py app android build`. No-op (leaves the APK
      # unsigned) when the signing secrets aren't configured, so forks still build.
      - name: Sign Android APK
        if: matrix.kind == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — release APK left UNSIGNED (not installable)."
            exit 0
          fi
          keystore="$RUNNER_TEMP/chords.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          bt="$ANDROID_HOME/build-tools/34.0.0"
          # Name the artifact chords-<label>.apk: the git tag on a tag build,
          # else a UTC datetime stamp. Mirrors butler.py's _release_label().
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="$(date -u +%Y%m%d-%H%M%S)"; fi
          shopt -s globstar nullglob
          for apk in app/src-tauri/gen/android/app/build/outputs/apk/**/*-release-unsigned.apk; do
            aligned="${apk/-unsigned/-aligned}"
            signed="$(dirname "$apk")/chords-${label}.apk"
            "$bt/zipalign" -p -f 4 "$apk" "$aligned"
            "$bt/apksigner" sign \
              --ks "$keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --out "$signed" "$aligned"
            rm -f "$aligned" "$apk"   # drop the unsigned APK so only the signed one is uploaded
            echo "signed -> $signed"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # The browser extension is just static files (no Rust/Node/Android toolchain),
  # so package it in a tiny standalone job and ship the zip on the Release next to
  # the native installers. Uses butler.py so the file selection / zip layout stays
  # identical to a local `python butler.py extension package`.
  package-extension:
    name: extension-zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          # Name the zip chords-extension-<label>.zip: the git tag on a tag build,
          # else a UTC datetime stamp. Same label rule as the Android APK above.
          if [ "$GITHUB_REF_TYPE" = tag ]; then label="$GITHUB_REF_NAME"; else label="$(date -u +%Y%m%d-%H%M%S)"; fi
          python3 butler.py extension package --label "$label"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          if-no-files-found: error
          path: dist/chords-extension-*.zip

  # Gather every target's artifacts and publish them on a GitHub Release.
  # Runs only for tag pushes (v*); skipped for branch / dispatch builds.
  release:
    needs: [build, package-extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Pull the section for this tag's version out of CHANGELOG.md and use it
      # verbatim as the release body. Fails if there's no matching entry, so a
      # release can't go out with empty/wrong notes.
      - name: Extract changelog for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[?" ver "\\]?([^0-9]|$)" { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md entry found for version $version"
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
          # Tags with a prerelease segment (e.g. v2026.6.1-beta-1) are marked pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
