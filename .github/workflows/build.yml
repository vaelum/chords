name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-appimage
            os: ubuntu-22.04
            kind: appimage
          - name: windows-exe
            os: windows-latest
            kind: windows
          - name: android-apk
            os: ubuntu-22.04
            kind: android

    steps:
      - uses: actions/checkout@v4

      # Node is needed by Tauri's beforeBuildCommand, which precompiles the
      # frontend JSX (server/scripts/build-frontend.js) before bundling.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust targets
        if: matrix.kind == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # ---- Linux (AppImage) system deps ----
      - name: Install Linux build deps
        if: matrix.kind == 'appimage'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # ---- Android toolchain ----
      - name: Set up JDK 17
        if: matrix.kind == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: matrix.kind == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK + platform
        if: matrix.kind == 'android'
        run: |
          sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      # ---- Tauri CLI (prebuilt binary, no compile) ----
      - name: Install Tauri CLI
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y tauri-cli@^2.0.0

      # ---- Builds ----
      - name: Build Linux AppImage
        if: matrix.kind == 'appimage'
        working-directory: app
        env:
          # linuxdeploy needs FUSE, which CI runners lack; extract-and-run instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: 1
        run: cargo tauri build --bundles appimage

      - name: Build Windows exe
        if: matrix.kind == 'windows'
        working-directory: app
        run: cargo tauri build --bundles nsis

      - name: Build Android APK
        if: matrix.kind == 'android'
        working-directory: app
        run: |
          cargo tauri android init
          cargo tauri android build --apk

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
