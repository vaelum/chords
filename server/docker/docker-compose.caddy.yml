# Caddy for a LOCAL production run — `scripts/build.sh` with no arguments.
#
# On the production host the proxy is a separate, longer-lived stack
# shared with the other services on the box, so this overlay is deliberately not
# part of a deploy: [server.deploy] compose_file in butler/butler.toml points at
# the base file only. Keeping it here means `build.sh` still gives you the real
# thing — Caddy, automatic TLS, the same Caddyfile — on your own machine.
services:
  caddy:
    container_name: chords-caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/entrypoint.sh:/entrypoint.sh:ro
      - ${HOME}/.chords:/chords-data:ro
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - chords
    networks:
      - edge
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
