services:
  chords:
    container_name: chords
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Fast Debian mirror for the image build; empty = default Debian CDN.
        # `butler.py server deploy` forwards $APT_MIRROR from your shell
        # (see build_env in butler/butler.toml).
        APT_MIRROR: ${APT_MIRROR:-}
    volumes:
      - ${HOME}/.chords:/chords-data
    environment:
      CHORDS_DATA_DIR: /chords-data
      # AI import key. Normally left empty here and read from
      # /chords-data/secrets.json instead (set it with
      # `python butler.py server key`); this passthrough is for one-off overrides.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    restart: unless-stopped

  caddy:
    container_name: chords-caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/entrypoint.sh:/entrypoint.sh:ro
      - ${HOME}/.chords:/chords-data:ro
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - chords
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
