services:
  chords:
    container_name: chords
    # --reload watches *.py by default; also watch the compiled frontend so a
    # rebuild (build-frontend.js) bounces the worker, recomputes BUILD_ID, and
    # the reconnecting SSE stream triggers the in-app "new version" reload prompt
    # in dev — mirroring what a production deploy does. (Editing a .jsx alone
    # does nothing until it's compiled to .js; run build-frontend.js --watch.)
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
             --reload-include '*.js' --reload-include '*.css' --reload-include '*.html'
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.chords:/chords-data
      - ../backend:/app/backend
      - ../frontend:/app/frontend
      # Forward the host's Claude Code login so the agent SDK can authenticate.
      - ${HOME}/.claude:/home/chords/.claude
      - ${HOME}/.claude.json:/home/chords/.claude.json

  # No Caddy in dev — hit port 8000 directly.
