[package]
name = "chords"
version = "0.1.0"
description = "chords — guitar tabs that follow you"
authors = ["amos"]
edition = "2021"
rust-version = "1.77.2"

# The library entry point is what Tauri's mobile (Android/iOS) runtimes call
# into. `staticlib`/`cdylib` are required for those targets; `rlib` for desktop.
[lib]
name = "chords_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, faster release bundles.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
